<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - SIPKBM</title>
<link rel="preconnect" href="https://fonts.bunny.net" />
<link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700,800&family=inter:400,500,600,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="mark">S</span> SIPKBM
    </div>
    <div class="card">
      <h1 class="auth-title">Log in to your account</h1>
      <p class="auth-sub">Enter your email and password below to log in</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" placeholder="email@example.com" required />
        </div>
        <div class="field">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label class="label" for="password">Password</label>
            <a href="#" style="font-size:.82rem;color:var(--a-blue);font-weight:600;margin-bottom:.45rem">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input class="input" type="password" id="password" placeholder="Password" required />
            <span class="input-icon" id="togglePw" title="Show password">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>
        <label class="checkbox" style="margin:.3rem 0 1.3rem">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
      </form>
      <div class="divider">ATAU</div>
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.1 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.8-2.9-.8-4.3s.3-3 .8-4.3l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.1-5.5c-2 1.3-4.6 2.1-8.4 2.1-6.4 0-11.7-3.6-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Masuk dengan Google
      </button>
      <p class="auth-foot">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
