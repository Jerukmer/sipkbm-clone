<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftarkan PKBM Anda - SIPKBM</title>
<link rel="preconnect" href="https://fonts.bunny.net" />
<link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700,800&family=inter:400,500,600,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div style="display:flex;justify-content:center;margin-bottom:1.2rem">
      <a href="index.html" style="font-family:'Instrument Sans';font-weight:800;font-size:1.3rem;color:#1a2b4a;display:flex;align-items:center;gap:.5rem">
        <span class="mark" style="background:var(--m-brand-grad);width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem">S</span> SIPKBM
      </a>
    </div>
    <div class="card">
      <h1 class="auth-title" style="font-size:1.45rem">Daftarkan PKBM Anda</h1>
      <p class="auth-sub">Cukup isi data dasar, pengaturan lembaga bisa dilengkapi nanti</p>

      <h2 class="eyebrow" style="margin-bottom:.7rem">Pilih Paket</h2>
      <button type="button" class="card" id="pkgBtn" data-selected="true" style="width:100%;text-align:left;padding:1rem 1.1rem;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--a-emerald);cursor:pointer">
        <div>
          <div class="font-display" style="font-weight:700;color:#1a2b4a">Professional</div>
          <div style="font-size:.8rem;color:#64748b">Coba gratis 14 hari</div>
        </div>
        <span class="badge badge-emerald">Paling Populer</span>
      </button>
      <p style="font-size:.78rem;color:#94a3b8;margin-top:.4rem">* Pilih salah satu paket</p>

      <div class="divider">ATAU ISI MANUAL</div>

      <form id="regForm" novalidate>
        <div class="field">
          <label class="label" for="name">Nama Anda *</label>
          <input class="input" type="text" id="name" placeholder="Nama lengkap" required />
        </div>
        <div class="field">
          <label class="label" for="email">Email *</label>
          <input class="input" type="email" id="email" placeholder="email@example.com" required />
        </div>
        <div class="field">
          <label class="label" for="wa">No. WhatsApp *</label>
          <input class="input" type="tel" id="wa" placeholder="08xxxxxxxxxx" required />
        </div>
        <div class="field">
          <label class="label" for="password">Password *</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" placeholder="Minimal 8 karakter" required />
            <span class="input-icon" data-toggle="regPw"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label class="label" for="confirm">Konfirmasi *</label>
          <div class="input-wrap">
            <input class="input" type="password" id="confirm" placeholder="Ulangi password" required />
            <span class="input-icon" data-toggle="regCfm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </div>
        </div>
        <label class="checkbox" style="margin:.3rem 0 1.3rem">
          <input type="checkbox" id="terms" />
          Saya menyetujui <a href="#" style="color:var(--a-blue);font-weight:600">Kebijakan Privasi</a> dan <a href="#" style="color:var(--a-blue);font-weight:600">Syarat & Ketentuan</a>
        </label>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" disabled style="opacity:.6;cursor:not-allowed">Daftarkan PKBM</button>
      </form>

      <div class="divider">ATAU</div>
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.1 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.8-2.9-.8-4.3s.3-3 .8-4.3l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.1-5.5c-2 1.3-4.6 2.1-8.4 2.1-6.4 0-11.7-3.6-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Daftar dengan Google
      </button>
      <p class="auth-foot">Sudah punya akun? <a href="login.html">Login disini</a></p>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
